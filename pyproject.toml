[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-ai-model-risk-workbench"
version = "0.1.0"
description = "Reproducible fairness, calibration, robustness, drift, and selective-prediction audits."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "joblib>=1.3", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "pydantic>=2.6", "scikit-learn>=1.4", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
